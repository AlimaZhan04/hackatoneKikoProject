name: Build and PostgreSQL CRUD
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kiko
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: kiko
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Configure test database
        run: echo 'DATABASE_URL=postgresql://kiko:ci_only_password@127.0.0.1:5432/kiko' > .env
      - run: npm run test:api
